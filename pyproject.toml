[project]
name = "kvitto-test-task"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.148.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
per-file-ignores = { "tests/test_domain.py" = ["RUF007"] }

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` в значениях аргументов по умолчанию — стандартный паттерн FastAPI.
extend-immutable-calls = ["fastapi.Depends"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Асинхронные тесты и фикстуры: единый event loop сессии,
# чтобы движок/сессии и HTTP-клиент не перескакивали между loop'ами.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
