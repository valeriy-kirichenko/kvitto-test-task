[project]
name = "kvitto-test-task"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.148.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
per-file-ignores = { "tests/test_domain.py" = ["RUF007"] }
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
