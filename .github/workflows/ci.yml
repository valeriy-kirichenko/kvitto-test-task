# Ruff и pytest на каждый push/pr.
#
# Тесты используют отдельную БД `kvitto_test_db` (см. tests/), поэтому в CI:
#  1) поднимаем PostgreSQL 16 service,
#  2) создаём тестовую БД (то же, что docker/postgres/init-db.sh локально),
#  3) применяем миграции alembic,
#  4) запускаем ruff и pytest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff-and-pytest:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kvitto_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kvitto_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kvitto_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kvitto_test_db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check app tests

      - name: Create test database (kvitto_test_db)
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE kvitto_test_db"

      - name: Apply migrations to test database
        run: ALEMBIC_DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head

      - name: pytest
        run: uv run pytest
